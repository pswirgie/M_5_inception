volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: /home/pswirgie/data/mariadb
      o: bind
      type: none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: /home/pswirgie/data/mariadb
      o: bind
      type: none
  nginx:
    name: nginx
    driver: local
    driver_opts:
      device: /home/pswirgie/data/nginx
      o: bind
      type: none


services:
  nginx:
    container_name: nginx
    build: ./nginx
    networks:
      - matcha
    volumes:
      - nginx:/var/www/html
    depends_on:
      - nginx
    ports:
      - "443:443"
    env_file:
      - .env
    restart: on-failure
  mariadb:
    container_name: mariadb
    build: ./mariadb
    networks:
      - matcha
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    restart: on-failure
  nginx:
    container_name: nginx
    build: ./nginx
    networks:
      - matcha
    volumes:
      - nginx:/var/www/html
    depends_on:
      - mariadb
    env_file:
      - .env
    restart: on-failure

networks:
  inception:
    name: inception
    driver: bridge